<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hava Durumu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="weather-card">

        <div class="card-header">
            <h2>Nilüfer <span>▼</span></h2>
            <button class="more-btn">•••</button>
        </div>

        <!-- MAIN WEATHER -->
        <div class="main-weather">
            <div class="main-left">
                <img src="cloudy.png" alt="Bulutlu" class="main-fmt-icon">
                <div>
                    <h1>19<span class="degree-symbol">°</span>C</h1>
                    <span class="date">11.07.2026</span>
                </div>
            </div>
            <div class="day">Çarşamba</div>
        </div>

        <div class="hourly-forecast">
            <div class="hourly-card">
                <span>15:00</span>
                <img src="cloudy.png" alt="Bulutlu" class="weather-fmt-icon">
                <span>Bulutlu</span>
                <span>19°C</span>
            </div>
            <div class="hourly-card">
                <span>16:00</span>
                <img src="cloudy.png" alt="Bulutlu" class="weather-fmt-icon">
                <span>Bulutlu</span>
                <span>18°C</span>
            </div>
            <div class="hourly-card">
                <span>17:00</span>
                <img src="cloudy.png" alt="Bulutlu" class="weather-fmt-icon">
                <span>Bulutlu</span>
                <span>18°C</span>
            </div>
            <div class="hourly-card">
                <span>18:00</span>
                <img src="cloudy.png" alt="Bulutlu" class="weather-fmt-icon">
                <span>Bulutlu</span>
                <span>16°C</span>
            </div>
        </div>

        <div class="weather-types">
            <div>
                <img src="snowy.png" alt="Karlı" class="footer-fmt-icon">
                <span>Karlı</span>
            </div>
            <div>
                <img src="sunny.png" alt="Güneşli" class="footer-fmt-icon">
                <span>Güneşli</span>
            </div>
            <div>
                <img src="rainy.png" alt="Yağmurlu" class="footer-fmt-icon">
                <span>Yağmurlu</span>
            </div>
            <div>
                <img src="snowy.png" alt="Bulutlu" class="footer-fmt-icon">
                <span>Bulutlu</span>
            </div>
        </div>

    </div>
</body>

</html>
